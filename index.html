<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 AI 채팅</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; margin:20px; }
    #chat { height:450px; overflow:auto; border:1px solid #555; padding:15px; margin-bottom:15px; background:#1e1e1e; line-height:1.5; }
    .user { color:#4fc3f7; margin:10px 0; }
    .ai { color:#81c784; margin:10px 0; }
    input { width:78%; padding:12px; font-size:16px; }
    button { padding:12px 20px; font-size:16px; background:#4fc3f7; border:none; color:white; cursor:pointer; }
  </style>
</head>
<body>
  <h2>AI 채팅 테스트</h2>
  <div id="chat"></div>
  <input id="input" placeholder="메시지를 입력하고 보내기 버튼 누르세요" />
  <button onclick="sendMessage()">보내기</button>

<script>
async function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const userText = input.value.trim();
    if (!userText) return;

    chat.innerHTML += `<div class="user"><strong>나:</strong> ${userText}</div>`;
    input.value = "";

    const loadingId = "load-" + Date.now();
    chat.innerHTML += `<div id="${loadingId}" class="ai"><strong>AI:</strong> 생각하는 중...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer 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"  
            },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{ role: "user", content: userText }]
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP 오류 ${response.status}`);
        }

        const data = await response.json();
        const aiText = data.choices[0].message.content;

        document.getElementById(loadingId).remove();
        chat.innerHTML += `<div class="ai"><strong>AI:</strong> ${aiText}</div>`;

    } catch (err) {
        document.getElementById(loadingId).remove();
        chat.innerHTML += `<div class="ai" style="color:red;"><strong>AI:</strong> 오류 발생: ${err.message}</div>`;
        console.error("전체 에러:", err);
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
